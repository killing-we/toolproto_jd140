[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "killing-we-toolproto_jd140"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出工具调用协议工程师·查询改写的语义漂移上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "killing-we" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://killing-we.github.io"
Repository = "https://github.com/killing-we/toolproto_jd140"
Issues = "https://github.com/killing-we/toolproto_jd140/issues"

[project.scripts]
toolproto_jd140 = "toolproto_jd140:main"

[tool.setuptools]
py-modules = ["toolproto_jd140"]
